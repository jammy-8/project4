{% extends "hBooking/base.html" %}
{% load static %}

{% block content %}
    <div class="container booking-container mt-5 h-100 text-white">
        <h1>Booking</h1>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <div class="row">
                </div>
                <div class="row mt-3">
                    <div class="col">
                        <label for="check-in" class="form-label">Check in</label>
                        <input type="date" class="form-control" id="check-in" name="check-in" required>
                    </div>
                    <div class="col">
                        <label for="check-out" class="form-label">Check out</label>
                        <input type="date" class="form-control" id="check-out" name="check-out" required>
                    </div>
                </div>
                <div class="dropdown mt-3">
                    <label for="hotel-type" class="form-label">Hotel Type</label>
                    <select class="form-select" name="room" id="hotel-type" required>
                        <option value="" selected disabled>Choose a hotel type</option>
                        {% for h in hotel_types %}
                        <option value="{{ h.hotel_id }}">{{ h.hotel_type }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-primary mt-3">Submit</button>
            </div>
        </form>
    </div>

{% endblock %}
